<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chroma Key Cross Display with Tuning Slider</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }

        /* 3x3 Grid Container locked to full screen height */
        .cross-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100vh;  
            height: 100vh; 
            gap: 0;        
        }

        .cam-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000; 
            box-sizing: border-box;
            overflow: hidden;
        }

        .cam-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; 
        }

        .cam-box canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2; 
            background-color: #000;
        }

        .camera-select {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            max-width: 90%;
            cursor: pointer;
            display: block;
        }

        /* Control UI Panels */
        .toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(30, 30, 30, 0.85);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .slider-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(30, 30, 30, 0.85);
            color: #fff;
            border: 1px solid #555;
            padding: 12px 16px;
            font-size: 13px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 180px;
        }

        .slider-container label {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .slider-container input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #555;
        }

        /* Global UI Hiding Classes */
        body.selectors-hidden .camera-select,
        body.selectors-hidden .slider-container {
            display: none;
        }

        /* Grid Map Positions */
        #box-top    { grid-row: 1; grid-column: 2; }
        #box-right  { grid-row: 2; grid-column: 3; }
        #box-bottom { grid-row: 3; grid-column: 2; }
        #box-left   { grid-row: 2; grid-column: 1; }

        /* Rotations */
        #box-top canvas    { }
        #box-right canvas  { transform: rotate(90deg); }
        #box-bottom canvas { transform: rotate(180deg); }
        #box-left canvas   { transform: rotate(270deg); }
    </style>
</head>
<body>

    <div id="cross-layout" class="cross-container">
        <div id="box-top" class="cam-box">
