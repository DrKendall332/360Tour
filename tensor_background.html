<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TF.js Secure AI Background Removal Cross Display</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.1/dist/body-pix.min.js"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            user-select: none;
        }

        .cross-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100vh;  
            height: 100vh; 
            gap: 0;        
        }

        .cam-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000; 
            box-sizing: border-box;
            overflow: hidden;
        }

        .cam-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; 
        }

        .cam-box canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2; 
            background-color: #000;
        }

        .camera-select {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10; 
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            max-width: 90%;
            cursor: pointer;
            display: block;
        }

        .toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(30, 30, 30, 0.85);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; z-index: 200;
            transition: opacity 0.5s ease;
        }

        body.selectors-hidden .camera-select {
            display: none;
        }

        #box-top    { grid-row: 1; grid-column: 2; }
        #box-right  { grid-row: 2; grid-column: 3; }
        #box-bottom { grid-row: 3; grid-column: 2; }
        #box-left   { grid-row: 2; grid-column: 1; }

        #box-top canvas    { }
        #box-right canvas  { transform: rotate(90deg); }
        #box-bottom canvas { transform: rotate(180deg); }
        #box-left canvas   { transform: rotate(270deg); }
    </style>
</head>
<body>

    <div id="loader" class="loading-overlay">Initializing Secure AI Engine...</div>

    <div id="cross-layout" class="cross-container">
        <div id="box-top" class="cam-box">
            <video id="video-0" autoplay playsinline muted></video>
            <canvas id="canvas-0"></canvas>
            <select id="select-0" class="camera-select"></select>
        </div>
        <div id="box-right" class="cam-box">
            <video id="video-1" autoplay playsinline muted></video>
            <canvas id="canvas-1"></canvas>
            <select id="select-1" class="camera-select"></select>
        </div>
        <div id="box-bottom" class="cam-box">
            <video id="video-2" autoplay playsinline muted></video>
            <canvas id="canvas-2"></canvas>
            <select id="select-2" class="camera-select"></select>
        </div>
        <div id="box-left" class="cam-box">
            <video id="video-3" autoplay playsinline muted></video>
            <canvas id="canvas-3"></canvas>
            <select id="select-3" class="camera-select"></select>
        </div>
    </div>

    <button id="btn-toggle" class="toggle-btn">Hide Selectors</button>

    <script>
        const videoElements = [
            document.getElementById('video-0'), document.getElementById('video-1'),
            document.getElementById('video-2'), document.getElementById('video-3')
        ];

        const canvasElements = [
            document.getElementById('canvas-0'), document.getElementById('canvas-1'),
            document.getElementById('canvas-2'), document.getElementById('canvas-3')
        ];

        const selectElements = [
            document.getElementById('select-0'), document.getElementById('select-1'),
            document.getElementById('select-2'), document.getElementById('select-3')
        ];

        const toggleButton = document.getElementById('btn-toggle');
        const loader = document.getElementById('loader');

        let availableDevices = [];
        let hardwareStreamCache = {}; 
        let slotCurrentDeviceIds = [null, null, null, null];
        let menusAreVisible = true;
        
        let bpModel = null; // Global shared BodyPix model instance

        async function init() {
            toggleButton.addEventListener('click', toggleDropdowns);

            try {
                // 1. Force TensorFlow.js to use the CSP-compliant WebGL backend
                await tf.setBackend('webgl');
                await tf.ready();

                // 2. Load the BodyPix model using lightweight performance parameters
                bpModel = await bodyPix.load({
                    architecture: 'MobileNetV1',
                    outputStride: 16,
                    multiplier: 0.50, // Low multiplier keeps it lightning fast across 4 feeds
                    quantBytes: 2
                });

                // Hide loader overlay
                loader.style.opacity = 0;
                setTimeout(() => loader.remove(), 500);

                // 3. Request permissions & list hardware cameras
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                availableDevices = devices.filter(device => device.kind === 'videoinput');

                if (availableDevices.length === 0) {
                    alert('No webcams detected.');
                    return;
                }

                selectElements.forEach((selectEl, slotIndex) => {
                    populateDropdown(selectEl, slotIndex);
                    selectEl.addEventListener('change', (e) => {
                        switchCamera(slotIndex, e.target.value);
                    });
                });

                // 4. Fire up the independent segmentation loops
                for (let i = 0; i < 4; i++) {
                    startBodyPixLoop(i);
                    const defaultDevice = availableDevices[i % availableDevices.length];
                    await
