<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen 4-Webcam Cross Display</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 3x3 Grid Container locked to full screen height */
        .cross-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100vh;  
            height: 100vh; 
            gap: 0;        
        }

        /* Container box for each camera slot */
        .cam-box {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #111;
            box-sizing: border-box;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover; 
            background-color: #000;
        }

        /* Style for the dropdown selectors */
        .camera-select {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            border: 1px solid #555;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 4px;
            max-width: 90%;
            cursor: pointer;
            display: block;
        }

        .camera-select:hover {
            background: rgba(30, 30, 30, 0.9);
        }

        /* Fixed Toggle Button in the bottom-right corner of the screen */
        .toggle-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 100; /* Ensures it stays on top of everything */
            background: rgba(30, 30, 30, 0.85);
            color: #fff;
            border: 1px solid #555;
            padding: 10px 16px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .toggle-btn:hover {
            background: rgba(60, 60, 60, 0.9);
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }

        /* Rule to hide selectors when the toggle state is active */
        .cross-container.selectors-hidden .camera-select {
            display: none;
        }

        /* Position the 4 boxes in the 3x3 grid */
        #box-top    { grid-row: 1; grid-column: 2; }
        #box-right  { grid-row: 2; grid-column: 3; }
        #box-bottom { grid-row: 3; grid-column: 2; }
        #box-left   { grid-row: 2; grid-column: 1; }

        /* Rotations */
        #box-top video    { /* 0 degrees */ }
        #box-right video  { transform: rotate(90deg); }
        #box-bottom video { transform: rotate(180deg); }
        #box-left video   { transform: rotate(270deg); }
    </style>
</head>

        </div>

        <div id="box-right" class="cam-box">

            <video id="video-3" autoplay playsinline muted></video>

    </div>
